name: Autonomous AI Issue & PR Assistant

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions:
  issues: write
  pull-requests: write
  contents: read

jobs:
  ai-assist:
    name: AI Skill Router & Triage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Analyze Issue / PR Content
        id: triage
        shell: python
        run: |
          import json, os, subprocess, sys
          from pathlib import Path
          sys.path.insert(0, 'tools')
          from lookup import route, find, group_for

          event_path = os.environ.get('GITHUB_EVENT_PATH')
          with open(event_path, 'r', encoding='utf-8') as f:
              event = json.load(f)

          is_pr = 'pull_request' in event
          item = event['pull_request'] if is_pr else event['issue']
          title = item.get('title', '')
          body = item.get('body', '') or ''
          user = item.get('user', {}).get('login', 'contributor')

          query = f"{title} {body[:300]}"
          matched_skill = route(query)
          matched_group = group_for(query)
          tools_found = find(query, limit=3)

          comment = [
              f"### 🤖 Universal AI Assistant Auto-Response",
              f"Hello @{user}! Thank you for your contribution to **Universal AI Skills**.",
              f"",
              f"Even while our human maintainers are offline, our automated system has analyzed your request:",
              f"- **Recommended Skill:** `{matched_skill}` (category: `{matched_group}`)",
          ]

          if tools_found:
              comment.append("\n**Relevant tools & documentation in this bundle:**")
              for t in tools_found:
                  comment.append(f"- [{t['name']}]({t['url']}) — *{t['purpose']}*")

          comment.extend([
              "",
              "**Quick Actions:**",
              f"- You can run `python tools/lookup.py route \"{title}\"` locally to inspect full details.",
              "- To install these skills in your project, run `python install_instructions.py .` or `& ./install.ps1 .`",
              "",
              "---",
              "*This automated triage ran via GitHub Actions in the cloud.*"
          ])

          output_text = "\n".join(comment)
          with open('comment.md', 'w', encoding='utf-8') as out:
              out.write(output_text)

      - name: Comment on Issue
        if: github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const commentBody = fs.readFileSync('comment.md', 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: commentBody
            });

      - name: Comment on PR
        if: github.event_name == 'pull_request_target'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const commentBody = fs.readFileSync('comment.md', 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: commentBody
            });
