name: Autonomous Cloud Maintenance & Healthcheck

on:
  schedule:
    # Runs every Monday at 06:00 UTC completely in the cloud (no local PC needed)
    - cron: '0 6 * * 1'
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  healthcheck-and-package:
    name: Verify & Package Skills
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Test Suite
        run: |
          python tests/test_bundle.py

      - name: Package Universal Skills Bundle
        run: |
          zip -r universal-ai-skills-latest.zip . -x ".git/*" -x ".github/*" -x "__pycache__/*" -x "*.pyc"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: universal-ai-skills-bundle
          path: universal-ai-skills-latest.zip
          retention-days: 30

      - name: Report Failure via Issue
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚨 Automated Maintenance Alert: Scheduled Test Failure',
              body: 'The automated weekly health check encountered an issue while validating the skills catalog and tests. Please check the latest GitHub Actions run logs.',
              labels: ['bug', 'automated-alert']
            });
